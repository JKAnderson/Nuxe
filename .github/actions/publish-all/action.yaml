name: Publish All
description: Publish for all target runtimes

inputs:
  title:
    required: true

runs:
  using: composite

  steps:
    - name: Publish for Windows
      uses: ./.github/actions/publish-target
      with:
        title: ${{ inputs.title }}
        target: win-x64
        target-friendly: windows-x64

